<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediScan NFC — Secure Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card glass-surface-deep">
      <div class="auth-brand">
        <div class="brand-icon-box">
          <i class="fas fa-hospital-symbol"></i>
        </div>
        <h1>MediScan NFC</h1>
        <p class="auth-subtitle">Hospital Operations Center — Secure Access</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-with-icon-wrap">
            <i class="fas fa-envelope input-field-icon"></i>
            <input type="email" id="email" name="email" class="form-control input-with-icon-padding" placeholder="Enter your email" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-with-icon-wrap">
            <i class="fas fa-lock input-field-icon"></i>
            <input type="password" id="password" name="password" class="form-control input-with-icon-padding" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <div class="form-group remember-group">
          <label class="custom-checkbox-styled">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span class="checkbox-label">Remember me (extended session)</span>
          </label>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          <i class="fas fa-sign-in-alt"></i> <span class="btn-text">Sign In</span>
          <span class="btn-loading" style="display: none;"><i class="fas fa-spinner fa-spin"></i> Signing In...</span>
        </button>
      </form>

      <div class="demo-accounts">
        <div class="demo-title">Demo Accounts (Click to Auto-Fill)</div>
        <div class="demo-grid">
          <button type="button" class="demo-btn admin" data-email="admin@mediscan.local" data-password="admin123" data-role="admin">
            <i class="fas fa-user-shield"></i> Admin
          </button>
          <button type="button" class="demo-btn doctor" data-email="doctor@mediscan.local" data-password="doctor123" data-role="doctor">
            <i class="fas fa-user-md"></i> Doctor
          </button>
          <button type="button" class="demo-btn reception" data-email="reception@mediscan.local" data-password="reception123" data-role="reception">
            <i class="fas fa-door-open"></i> Reception
          </button>
        </div>
      </div>

      <div class="footer-links">
        <a href="#" id="forgotPassword"><i class="fas fa-key"></i> Forgot Password?</a>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { Auth } from '/js/auth.js';

    // Toast notification system using style.css classes
    function showToast(message, type = 'info') {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = `toast-notification toast-${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> <span>${message}</span>`;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        setTimeout(() => toast.remove(), 350);
      }, 4000);
    }

    // Demo account buttons
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('email').value = btn.dataset.email;
        document.getElementById('password').value = btn.dataset.password;
        showToast(`Loaded ${btn.textContent.trim()} credentials`, 'info');
      });
    });

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnLogin');
      const btnText = btn.querySelector('.btn-text');
      const btnLoading = btn.querySelector('.btn-loading');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!email || !password) {
        showToast('Please enter email and password', 'error');
        return;
      }

      btn.disabled = true;
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline-flex';

      try {
        // Use Auth module for login (it handles token storage)
        const data = await Auth.login(email, password, rememberMe);

        showToast(`Welcome, ${data.user.name}!`, 'success');

        // Redirect based on role
        setTimeout(() => {
          const roleRoutes = {
            'admin': 'admin.html',
            'doctor': 'doctor.html',
            'reception': 'reception.html'
          };
          window.location.href = roleRoutes[data.user.role] || 'index.html';
        }, 800);

      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
      }
    });

    // Check if already logged in on page load
    (async function() {
      const token = Auth.getToken();
      if (token) {
        // Verify token with server using Auth.fetch
        try {
          const response = await Auth.fetch('/api/auth/me');
          if (response.ok) {
            const data = await response.json();
            const roleRoutes = {
              'admin': 'admin.html',
              'doctor': 'doctor.html',
              'reception': 'reception.html'
            };
            if (roleRoutes[data.user.role]) {
              showToast('Valid session found. Redirecting...', 'info');
              setTimeout(() => {
                window.location.href = roleRoutes[data.user.role];
              }, 500);
              return;
            }
          } else {
            // Token invalid, clear storage
            await Auth.logout();
          }
        } catch {
          await Auth.logout();
        }
      }
    })();
  </script>
</body>
</html>
